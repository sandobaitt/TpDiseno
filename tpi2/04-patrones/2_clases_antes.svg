entity" data-qualified-name="EstadoCuota" id="ent0004" data-source-line="39"><rect x="267" y="497.099" width="112.728" height="85.795" fill="#FFF" style="stroke:#444;stroke-width:0.5;" rx="4" ry="4"/><ellipse cx="281" cy="517.047" rx="10" ry="10" fill="#EB937F" style="stroke:#181818;stroke-width:1;"/><path d="M283.469,521.547 L277.563,521.547 L277.563,512.063 L283.469,512.063 L283.469,513.719 L279.438,513.719 L279.438,515.766 L283.094,515.766 L283.094,517.422 L279.438,517.422 L279.438,519.891 L283.469,519.891 L283.469,521.547 Z " fill="#000"/><text x="292" y="514.292" fill="#000" font-size="13" textLength="86.728" font-style="italic" font-family="Liberation Sans">«enumeration»</text><text x="297.783" y="529.241" fill="#000" font-size="13" textLength="75.163" font-family="Liberation Sans">EstadoCuota</text><line x1="268" y1="536.996" x2="378.728" y2="536.996" style="stroke:#444;stroke-width:0.5;"/><text x="273" y="553.19" fill="#000" font-size="13" textLength="74.401" font-family="Liberation Sans">PENDIENTE</text><text x="273" y="568.139" fill="#000" font-size="13" textLength="54.184" font-family="Liberation Sans">PAGADA</text><line x1="268" y1="574.894" x2="378.728" y2="574.894" style="stroke:#444;stroke-width:0.5;"/></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="49"><path d="M418.5,341.099 L418.5,383.099 L400.609,387.099 L418.5,391.099 L418.5,432.791 A4,4 0 0 0 422.5,436.791 L896.473,436.791 A4,4 0 0 0 900.473,432.791 L900.473,347.099 L890.473,337.099 L422.5,337.099 A4,4 0 0 0 418.5,341.099" style="stroke:#BA5;stroke-width:0.5;" fill="#FFFBE6"/><path d="M890.473,337.099 L890.473,345.099 A2,2 0 0 0 892.473,347.099 L900.473,347.099 L890.473,337.099" style="stroke:#BA5;stroke-width:0.5;" fill="#FFFBE6"/><text x="424.5" y="354.292" fill="#000" font-size="13" textLength="66.473" font-weight="700" font-family="Liberation Sans">Problemas</text><text x="424.5" y="369.241" fill="#000" font-size="13" textLength="439.677" font-family="Liberation Sans">- El Sistema pregunta c.estado = PENDIENTE y mira por dentro de la cuota.</text><text x="424.5" y="384.19" fill="#000" font-size="13" textLength="284.705" font-family="Liberation Sans">- marcarPagada() decide con un if según el valor:</text><text x="431.724" y="399.139" fill="#000" font-size="13" textLength="453.75" font-family="Liberation Sans">si es PENDIENTE pasa a PAGADA; si ya es PAGADA, no hay una regla clara.</text><text x="424.5" y="414.087" fill="#000" font-size="13" textLength="318.671" font-family="Liberation Sans">- Cada estado nuevo (por ejemplo, ANULADA) obliga a</text><text x="431.724" y="429.036" fill="#000" font-size="13" textLength="273.889" font-family="Liberation Sans">tocar ese if y todos los que consultan el estado.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-link-type="aggregation"><polygon points="323.5,135.108,319.5,141.108,323.5,147.108,327.5,141.108,323.5,135.108" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M323.5,147.108 C323.5,164.543 323.5,172.525 323.5,189.085" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="325.5" y="167.292" fill="#000" font-size="13" textLength="49.137" font-family="Liberation Sans">alumnos</text><text x="317.5" y="186.278" fill="#000" font-size="13" font-family="Liberation Sans">*</text><text x="315.5" y="148.302" fill="#000" font-size="13" font-family="Liberation Sans">1</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-link-type="composition"><polygon points="323.5,260.425,319.5,266.425,323.5,272.425,327.5,266.425,323.5,260.425" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M323.5,272.425 C323.5,288.19 323.5,295.443 323.5,314.096" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="325.5" y="292.292" fill="#000" font-size="13" textLength="38.302" font-family="Liberation Sans">cuota